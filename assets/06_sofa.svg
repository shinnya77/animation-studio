<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <linearGradient id="sofaG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4AA7C"/>
      <stop offset="100%" stop-color="#B8905C"/>
    </linearGradient>
    <linearGradient id="sofaArm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C89C6C"/>
      <stop offset="100%" stop-color="#B08050"/>
    </linearGradient>
    <linearGradient id="sofaSeat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8986C"/>
      <stop offset="40%" stop-color="#C49468"/>
      <stop offset="100%" stop-color="#B88858"/>
    </linearGradient>
  </defs>

  <!-- Shadow on floor -->
  <ellipse cx="450" cy="480" rx="420" ry="25" fill="rgba(100,70,40,0.12)"/>

  <!-- Legs -->
  <rect x="120" y="420" width="18" height="50" rx="3" fill="#8C6840"/>
  <rect x="762" y="420" width="18" height="50" rx="3" fill="#8C6840"/>
  <rect x="300" y="420" width="14" height="45" rx="3" fill="#8C6840"/>
  <rect x="586" y="420" width="14" height="45" rx="3" fill="#8C6840"/>

  <!-- Back rest -->
  <rect x="80" y="80" width="740" height="220" rx="20" fill="url(#sofaG)"/>
  <!-- Back rest highlight -->
  <rect x="90" y="85" width="720" height="30" rx="15" fill="#DDB88C" opacity="0.4"/>

  <!-- Seat cushions -->
  <rect x="100" y="280" width="350" height="120" rx="16" fill="url(#sofaSeat)"/>
  <rect x="450" y="280" width="350" height="120" rx="16" fill="url(#sofaSeat)"/>
  <!-- Seat seam -->
  <line x1="450" y1="295" x2="450" y2="385" stroke="#A87848" stroke-width="2" opacity="0.3"/>
  <!-- Seat highlights -->
  <ellipse cx="275" cy="320" rx="120" ry="20" fill="#D4A878" opacity="0.3"/>
  <ellipse cx="625" cy="320" rx="120" ry="20" fill="#D4A878" opacity="0.3"/>

  <!-- Left arm -->
  <rect x="60" y="100" width="70" height="300" rx="18" fill="url(#sofaArm)"/>
  <rect x="64" y="105" width="62" height="40" rx="14" fill="#D0A474" opacity="0.4"/>

  <!-- Right arm -->
  <rect x="770" y="100" width="70" height="300" rx="18" fill="url(#sofaArm)"/>
  <rect x="774" y="105" width="62" height="40" rx="14" fill="#D0A474" opacity="0.4"/>

  <!-- Cushion 1 (pink) -->
  <g transform="translate(220,140) rotate(-8)">
    <rect x="0" y="0" width="120" height="110" rx="22" fill="#F7C4C4"/>
    <rect x="8" y="6" width="104" height="40" rx="14" fill="#FCD8D8" opacity="0.5"/>
    <line x1="60" y1="30" x2="60" y2="85" stroke="#ECA8A8" stroke-width="1.5" opacity="0.3"/>
    <line x1="30" y1="55" x2="90" y2="55" stroke="#ECA8A8" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- Cushion 2 (blue) -->
  <g transform="translate(560,150) rotate(6)">
    <rect x="0" y="0" width="110" height="100" rx="20" fill="#C4D8F0"/>
    <rect x="8" y="6" width="94" height="35" rx="12" fill="#D4E4F8" opacity="0.5"/>
    <line x1="55" y1="28" x2="55" y2="76" stroke="#A0B8D8" stroke-width="1.5" opacity="0.3"/>
    <line x1="28" y1="50" x2="82" y2="50" stroke="#A0B8D8" stroke-width="1.5" opacity="0.3"/>
  </g>
</svg>