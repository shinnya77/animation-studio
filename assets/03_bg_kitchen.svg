<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="kwG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFCF4"/>
      <stop offset="100%" stop-color="#F8F0E4"/>
    </linearGradient>
    <linearGradient id="kfG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8E0D4"/>
      <stop offset="100%" stop-color="#D8CFC0"/>
    </linearGradient>
    <linearGradient id="tileG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4F0EC"/>
      <stop offset="100%" stop-color="#ECE8E0"/>
    </linearGradient>
  </defs>

  <!-- Wall -->
  <rect width="1920" height="680" fill="url(#kwG)"/>

  <!-- Tile backsplash area (behind counter) -->
  <rect x="0" y="300" width="1920" height="380" fill="url(#tileG)"/>
  <!-- Tile grid -->
  <g stroke="#E0D8CC" stroke-width="0.8" opacity="0.4">
    <line x1="0" y1="340" x2="1920" y2="340"/>
    <line x1="0" y1="380" x2="1920" y2="380"/>
    <line x1="0" y1="420" x2="1920" y2="420"/>
    <line x1="0" y1="460" x2="1920" y2="460"/>
    <line x1="0" y1="500" x2="1920" y2="500"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="580" x2="1920" y2="580"/>
    <line x1="0" y1="620" x2="1920" y2="620"/>
    <line x1="0" y1="660" x2="1920" y2="660"/>
    <!-- vertical tile lines -->
    <line x1="80" y1="300" x2="80" y2="680"/>
    <line x1="160" y1="300" x2="160" y2="680"/>
    <line x1="240" y1="300" x2="240" y2="680"/>
    <line x1="320" y1="300" x2="320" y2="680"/>
    <line x1="400" y1="300" x2="400" y2="680"/>
    <line x1="480" y1="300" x2="480" y2="680"/>
    <line x1="560" y1="300" x2="560" y2="680"/>
    <line x1="640" y1="300" x2="640" y2="680"/>
    <line x1="720" y1="300" x2="720" y2="680"/>
    <line x1="800" y1="300" x2="800" y2="680"/>
    <line x1="880" y1="300" x2="880" y2="680"/>
    <line x1="960" y1="300" x2="960" y2="680"/>
    <line x1="1040" y1="300" x2="1040" y2="680"/>
    <line x1="1120" y1="300" x2="1120" y2="680"/>
    <line x1="1200" y1="300" x2="1200" y2="680"/>
    <line x1="1280" y1="300" x2="1280" y2="680"/>
    <line x1="1360" y1="300" x2="1360" y2="680"/>
    <line x1="1440" y1="300" x2="1440" y2="680"/>
    <line x1="1520" y1="300" x2="1520" y2="680"/>
    <line x1="1600" y1="300" x2="1600" y2="680"/>
    <line x1="1680" y1="300" x2="1680" y2="680"/>
    <line x1="1760" y1="300" x2="1760" y2="680"/>
    <line x1="1840" y1="300" x2="1840" y2="680"/>
  </g>

  <!-- Floor (kitchen tile) -->
  <rect y="680" width="1920" height="400" fill="url(#kfG)"/>
  <!-- Floor tile grid -->
  <g stroke="#CCC4B8" stroke-width="0.6" opacity="0.3">
    <line x1="0" y1="760" x2="1920" y2="760"/>
    <line x1="0" y1="840" x2="1920" y2="840"/>
    <line x1="0" y1="920" x2="1920" y2="920"/>
    <line x1="0" y1="1000" x2="1920" y2="1000"/>
    <line x1="160" y1="680" x2="160" y2="1080"/>
    <line x1="320" y1="680" x2="320" y2="1080"/>
    <line x1="480" y1="680" x2="480" y2="1080"/>
    <line x1="640" y1="680" x2="640" y2="1080"/>
    <line x1="800" y1="680" x2="800" y2="1080"/>
    <line x1="960" y1="680" x2="960" y2="1080"/>
    <line x1="1120" y1="680" x2="1120" y2="1080"/>
    <line x1="1280" y1="680" x2="1280" y2="1080"/>
    <line x1="1440" y1="680" x2="1440" y2="1080"/>
    <line x1="1600" y1="680" x2="1600" y2="1080"/>
    <line x1="1760" y1="680" x2="1760" y2="1080"/>
    <line x1="1920" y1="680" x2="1920" y2="1080"/>
  </g>

  <!-- Small window above backsplash -->
  <rect x="800" y="40" width="320" height="240" rx="3" fill="#D8C8B0" stroke="#C8B8A0" stroke-width="2"/>
  <rect x="812" y="52" width="144" height="108" fill="#90C8F0"/>
  <rect x="964" y="52" width="144" height="108" fill="#90C8F0"/>
  <rect x="812" y="168" width="144" height="104" fill="#90C8F0"/>
  <rect x="964" y="168" width="144" height="104" fill="#90C8F0"/>
  <ellipse cx="870" cy="90" rx="30" ry="10" fill="white" opacity="0.5"/>
  <rect x="800" y="158" width="320" height="8" fill="#D8C8B0"/>
  <rect x="954" y="40" width="8" height="240" fill="#D8C8B0"/>

  <!-- Upper cabinets -->
  <rect x="40" y="60" width="300" height="230" rx="3" fill="#F8F4EE" stroke="#E0D4C4" stroke-width="2"/>
  <line x1="190" y1="60" x2="190" y2="290" stroke="#E0D4C4" stroke-width="2"/>
  <rect x="120" y="170" width="20" height="4" rx="2" fill="#C8B8A4"/>
  <rect x="220" y="170" width="20" height="4" rx="2" fill="#C8B8A4"/>

  <rect x="1580" y="60" width="300" height="230" rx="3" fill="#F8F4EE" stroke="#E0D4C4" stroke-width="2"/>
  <line x1="1730" y1="60" x2="1730" y2="290" stroke="#E0D4C4" stroke-width="2"/>
  <rect x="1660" y="170" width="20" height="4" rx="2" fill="#C8B8A4"/>
  <rect x="1760" y="170" width="20" height="4" rx="2" fill="#C8B8A4"/>

  <!-- Ambient light -->
  <ellipse cx="960" cy="400" rx="500" ry="250" fill="rgba(255,250,230,0.08)"/>
</svg>