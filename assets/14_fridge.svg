<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 620" width="260" height="620">
  <defs>
    <linearGradient id="fridgeG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F0ECE4"/>
      <stop offset="50%" stop-color="#FFFCF8"/>
      <stop offset="100%" stop-color="#E8E4DC"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="130" cy="608" rx="120" ry="12" fill="rgba(80,60,30,0.08)"/>
  <!-- Body -->
  <rect x="15" y="10" width="230" height="590" rx="6" fill="url(#fridgeG)" stroke="#D8D0C4" stroke-width="2"/>
  <!-- Upper door (freezer) -->
  <rect x="22" y="18" width="216" height="180" rx="3" fill="none" stroke="#E0D8CC" stroke-width="1.5"/>
  <!-- Lower door (fridge) -->
  <rect x="22" y="208" width="216" height="382" rx="3" fill="none" stroke="#E0D8CC" stroke-width="1.5"/>
  <!-- Handles -->
  <rect x="214" y="80" width="8" height="55" rx="4" fill="#C8C0B4"/>
  <rect x="214" y="360" width="8" height="65" rx="4" fill="#C8C0B4"/>
  <!-- Door seam -->
  <line x1="22" y1="202" x2="238" y2="202" stroke="#D0C8BC" stroke-width="2"/>
  <!-- Magnets -->
  <rect x="46" y="50" width="32" height="26" rx="3" fill="#F0C0C0" opacity="0.6"/>
  <rect x="100" y="40" width="26" height="30" rx="3" fill="#C0D0F0" opacity="0.6"/>
  <circle cx="168" cy="62" r="16" fill="#C0E0C0" opacity="0.5"/>
  <!-- Ice dispenser -->
  <rect x="70" y="126" width="90" height="44" rx="4" fill="#E4DCD0"/>
</svg>