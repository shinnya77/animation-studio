<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 520" width="320" height="520">
  <defs>
    <!-- Ghost body — pale blue-white translucency -->
    <linearGradient id="ghostBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d0e8ff" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#e8f4ff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#b0d0f0" stop-opacity="0.7"/>
    </linearGradient>
    <!-- Ghost head gradient — extremely pale -->
    <radialGradient id="ghostHead" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f0f8ff" stop-opacity="0.92"/>
      <stop offset="50%" stop-color="#d8eeff" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#a0c8ee" stop-opacity="0.65"/>
    </radialGradient>
    <!-- Ghost glow aura -->
    <radialGradient id="ghostAura" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#88bbee" stop-opacity="0.4"/>
      <stop offset="40%" stop-color="#4488cc" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1144aa" stop-opacity="0"/>
    </radialGradient>
    <!-- Lower body dissolve gradient — severed at knees -->
    <linearGradient id="kneeDiss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b0ccee" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#88aadd" stop-opacity="0.5"/>
      <stop offset="80%" stop-color="#5588cc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2244aa" stop-opacity="0"/>
    </linearGradient>
    <!-- Misty dissolve at bottom (knee level) -->
    <linearGradient id="mistDiss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aaccee" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#88aad8" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#5588bb" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#224488" stop-opacity="0"/>
    </linearGradient>
    <!-- Glow filter (outer ghost halo) -->
    <filter id="ghostGlow" x="-60%" y="-30%" width="220%" height="160%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Inner soft glow -->
    <filter id="innerGlow" x="-30%" y="-15%" width="160%" height="130%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Translucency filter -->
    <filter id="ghostBlur" x="-10%" y="-5%" width="120%" height="110%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Mist / dissolve turbulence -->
    <filter id="dissolveEdge" x="-20%" y="-10%" width="140%" height="120%">
      <feTurbulence type="turbulence" baseFrequency="0.04 0.015" numOctaves="4" seed="8" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
      <feGaussianBlur in="displaced" stdDeviation="4" result="blurred"/>
      <feMerge><feMergeNode in="blurred"/></feMerge>
    </filter>
    <!-- Hair wisp filter -->
    <filter id="hairWisp" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="turbulence" baseFrequency="0.02 0.01" numOctaves="3" seed="15" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- Dark school clothes -->
    <linearGradient id="clothesG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0e1a" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#141828" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0a0e1a" stop-opacity="0.85"/>
    </linearGradient>
    <!-- Tears / water on face -->
    <linearGradient id="tearG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aaccee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#88aadd" stop-opacity="0.4"/>
    </linearGradient>
    <!-- Misty knee bottom -->
    <radialGradient id="kneeMist" cx="50%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#88aaee" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#5588dd" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#224488" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- === OUTER GHOST AURA / HALO === -->
  <!-- Large diffuse halo around whole figure -->
  <ellipse cx="160" cy="250" rx="155" ry="280" fill="url(#ghostAura)" opacity="0.7" filter="url(#ghostGlow)"/>
  <!-- Secondary inner halo -->
  <ellipse cx="160" cy="240" rx="100" ry="220" fill="#6699cc" opacity="0.12" filter="url(#innerGlow)"/>
  <!-- Very faint tertiary glow -->
  <ellipse cx="160" cy="230" rx="80" ry="180" fill="#88bbee" opacity="0.08" filter="url(#ghostGlow)"/>

  <!-- === MIST WISPS AT BOTTOM (where legs should be — just mist) === -->
  <!-- Wide mist spread at knee level (y~380-420 area) -->
  <ellipse cx="145" cy="415" rx="90" ry="30" fill="url(#kneeMist)" opacity="0.6" filter="url(#dissolveEdge)"/>
  <ellipse cx="175" cy="425" rx="75" ry="22" fill="#5588cc" opacity="0.25" filter="url(#dissolveEdge)"/>
  <!-- Wispy mist tendrils floating down -->
  <path d="M110,400 Q100,420 105,445 Q108,455 112,450 Q115,445 112,430 Q110,415 115,400 Z"
    fill="url(#mistDiss)" opacity="0.5" filter="url(#dissolveEdge)"/>
  <path d="M145,408 Q140,430 142,452 Q143,460 147,456 Q150,450 148,435 Q145,418 148,408 Z"
    fill="url(#mistDiss)" opacity="0.45" filter="url(#dissolveEdge)"/>
  <path d="M175,408 Q178,428 175,450 Q174,458 178,456 Q182,452 180,435 Q178,418 180,408 Z"
    fill="url(#mistDiss)" opacity="0.4" filter="url(#dissolveEdge)"/>
  <path d="M200,402 Q210,425 205,448 Q203,456 207,454 Q211,450 208,432 Q206,415 208,402 Z"
    fill="url(#mistDiss)" opacity="0.45" filter="url(#dissolveEdge)"/>
  <!-- Additional thin wisps -->
  <path d="M125,412 Q118,435 122,455" fill="none" stroke="#6699cc" stroke-width="4" stroke-linecap="round" opacity="0.3" filter="url(#dissolveEdge)"/>
  <path d="M160,415 Q157,440 160,462" fill="none" stroke="#88aadd" stroke-width="3" stroke-linecap="round" opacity="0.25" filter="url(#dissolveEdge)"/>
  <path d="M190,413 Q196,438 192,458" fill="none" stroke="#6699cc" stroke-width="3" stroke-linecap="round" opacity="0.25" filter="url(#dissolveEdge)"/>

  <!-- === LOWER BODY — severed at knees, dissolving === -->
  <!-- Left leg (only thigh portion — no calf/foot) -->
  <path d="M118,280 Q108,305 105,335 Q103,355 106,375 Q112,388 120,390 Q125,392 128,385 Q132,375 130,355 Q128,330 130,305 Q128,288 122,280 Z"
    fill="url(#kneeDiss)" opacity="0.75" filter="url(#ghostBlur)"/>
  <!-- Right leg (only thigh portion) -->
  <path d="M190,280 Q200,305 202,335 Q204,355 201,375 Q195,388 187,390 Q182,392 179,385 Q175,375 177,355 Q179,330 177,305 Q179,288 185,280 Z"
    fill="url(#kneeDiss)" opacity="0.75" filter="url(#ghostBlur)"/>

  <!-- Leg dissolve at knee — hard cutoff that dissolves into mist -->
  <rect x="95" y="355" width="48" height="40" rx="8" fill="url(#mistDiss)" opacity="0.7" filter="url(#dissolveEdge)"/>
  <rect x="170" y="355" width="48" height="40" rx="8" fill="url(#mistDiss)" opacity="0.7" filter="url(#dissolveEdge)"/>

  <!-- === SCHOOL UNIFORM — dark clothes on ghostly body === -->
  <!-- Main shirt/top (dark school uniform) -->
  <rect x="105" y="185" width="110" height="115" rx="12" fill="url(#clothesG)" opacity="0.82"/>
  <!-- Collar/lapel -->
  <path d="M133,192 L160,210 L187,192" fill="url(#clothesG)" opacity="0.9" stroke="#0a0e1a" stroke-width="1"/>
  <!-- School sailor collar detail (Japanese elementary) -->
  <path d="M115,198 Q160,218 205,198" fill="url(#clothesG)" stroke="#1a2035" stroke-width="1.5" opacity="0.6"/>
  <!-- Shirt seam line -->
  <line x1="160" y1="210" x2="160" y2="298" stroke="#0a0e1a" stroke-width="1.5" opacity="0.4"/>
  <!-- Pants/shorts bottom area -->
  <rect x="112" y="268" width="96" height="50" rx="7" fill="#080c18" opacity="0.85"/>
  <!-- Pants waistband -->
  <rect x="110" y="265" width="100" height="12" rx="4" fill="#0a0e20" opacity="0.9"/>
  <!-- Uniform sleeve edges (ghostly, slightly see-through) -->
  <rect x="105" y="185" width="110" height="22" rx="9" fill="#14182e" opacity="0.7"/>

  <!-- === GHOST BODY OVERLAY — semi-transparent pale blue-white === -->
  <!-- Body shape overlay (makes clothes look ghostly) -->
  <rect x="107" y="187" width="106" height="113" rx="11" fill="#c8e0f8" opacity="0.18"/>
  <!-- Ghostly translucency shimmer -->
  <rect x="120" y="195" width="30" height="100" rx="8" fill="#ffffff" opacity="0.1"/>

  <!-- === ARMS (limp, hanging — crying posture) === -->
  <!-- Left arm (hanging down, slightly forward — defeated posture) -->
  <path d="M108,195 Q94,215 88,245 Q84,265 86,285 Q88,298 94,300 Q100,302 104,295 Q108,280 108,258 Q108,232 112,210 Z"
    fill="url(#ghostBody)" opacity="0.7" filter="url(#ghostBlur)"/>
  <!-- Left hand (pale ghost hands, fingers drooping) -->
  <ellipse cx="94" cy="303" rx="14" ry="12" fill="#d8eeff" opacity="0.7"/>
  <!-- Drooping fingers left -->
  <path d="M84,300 Q80,315 84,322" fill="none" stroke="#c0d8f0" stroke-width="5" stroke-linecap="round" opacity="0.65"/>
  <path d="M92,304 Q89,320 93,328" fill="none" stroke="#c0d8f0" stroke-width="5" stroke-linecap="round" opacity="0.65"/>
  <path d="M100,305 Q98,320 101,326" fill="none" stroke="#c0d8f0" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <path d="M108,303 Q107,315 109,320" fill="none" stroke="#c0d8f0" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
  <!-- Arm dark sleeve over it -->
  <path d="M108,195 Q96,218 91,248" fill="#0a0e1a" stroke="none" opacity="0.7"/>

  <!-- Right arm (same, hanging limp) -->
  <path d="M212,195 Q226,215 232,245 Q236,265 234,285 Q232,298 226,300 Q220,302 216,295 Q212,280 212,258 Q212,232 208,210 Z"
    fill="url(#ghostBody)" opacity="0.7" filter="url(#ghostBlur)"/>
  <!-- Right hand -->
  <ellipse cx="226" cy="303" rx="14" ry="12" fill="#d8eeff" opacity="0.7"/>
  <!-- Drooping fingers right -->
  <path d="M216,300 Q215,315 217,322" fill="none" stroke="#c0d8f0" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
  <path d="M224,304 Q223,320 225,328" fill="none" stroke="#c0d8f0" stroke-width="5" stroke-linecap="round" opacity="0.65"/>
  <path d="M232,304 Q231,320 233,326" fill="none" stroke="#c0d8f0" stroke-width="5" stroke-linecap="round" opacity="0.65"/>
  <path d="M240,300 Q241,313 239,319" fill="none" stroke="#c0d8f0" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <!-- Sleeve -->
  <path d="M212,195 Q224,218 229,248" fill="#0a0e1a" stroke="none" opacity="0.7"/>

  <!-- === NECK === -->
  <rect x="148" y="158" width="24" height="34" rx="8" fill="#d8ecff" opacity="0.72"/>

  <!-- === HEAD — bowed, chin down (crying posture) === -->
  <!-- Ghost head aura -->
  <ellipse cx="160" cy="110" rx="68" ry="72" fill="#88aadd" opacity="0.2" filter="url(#innerGlow)"/>
  <!-- Main head shape — bowed forward, slightly down-tilted -->
  <!-- The head is tilted down (chin toward chest in crying/grieving pose) -->
  <ellipse cx="160" cy="118" rx="52" ry="57" fill="url(#ghostHead)"/>

  <!-- === HAIR — dark, obscuring face (bowed head, hair falls forward) === -->
  <!-- Massive dark hair volume covering face — head is down, hair cascades forward -->
  <ellipse cx="160" cy="85" rx="54" ry="32" fill="#0a0808" opacity="0.9"/>
  <!-- Hair falls over face from top -->
  <path d="M108,90 Q100,110 98,135 Q97,155 100,170 Q104,182 110,180 Q116,178 116,162 Q115,140 116,115 Q114,95 110,88 Z"
    fill="#0c0a08" opacity="0.88" filter="url(#hairWisp)"/>
  <path d="M212,90 Q220,110 222,135 Q223,155 220,170 Q216,182 210,180 Q204,178 204,162 Q205,140 204,115 Q206,95 210,88 Z"
    fill="#0c0a08" opacity="0.88" filter="url(#hairWisp)"/>
  <!-- Center hair falls over face (face mostly hidden — unsettling) -->
  <path d="M135,80 Q128,100 124,125 Q122,148 124,168 Q126,180 130,180 Q136,180 138,165 Q140,145 138,120 Q136,96 138,82 Z"
    fill="#0e0c0a" opacity="0.85"/>
  <path d="M160,78 Q155,98 153,124 Q152,148 154,168 Q156,178 160,178 Q164,178 166,168 Q168,148 167,124 Q165,98 160,78 Z"
    fill="#0e0c0a" opacity="0.85"/>
  <path d="M185,80 Q192,100 196,125 Q198,148 196,168 Q194,180 190,180 Q184,180 182,165 Q180,145 182,120 Q184,96 182,82 Z"
    fill="#0e0c0a" opacity="0.85"/>
  <!-- Hair top sweep/crown -->
  <path d="M110,88 Q120,72 140,70 Q160,68 180,70 Q200,72 210,88" fill="#0a0808" opacity="0.9"/>
  <!-- Stray hair wisps (ghostly hair that floats slightly) -->
  <path d="M108,90 Q100,75 104,60 Q106,52 112,55" fill="none" stroke="#181410" stroke-width="3" opacity="0.6" filter="url(#hairWisp)"/>
  <path d="M212,90 Q220,75 216,60 Q214,52 208,55" fill="none" stroke="#181410" stroke-width="3" opacity="0.55" filter="url(#hairWisp)"/>
  <path d="M135,80 Q130,65 136,55" fill="none" stroke="#181410" stroke-width="2" opacity="0.5" filter="url(#hairWisp)"/>
  <path d="M185,80 Q190,65 184,55" fill="none" stroke="#181410" stroke-width="2" opacity="0.5" filter="url(#hairWisp)"/>

  <!-- === FACE — mostly hidden by hair, just hint of pale face visible === -->
  <!-- Very pale face glimpsed through parted hair -->
  <!-- Just the lower face/chin visible (head bowed, hair covers most of it) -->
  <!-- Partial glimpse — chin and lower cheeks -->
  <ellipse cx="160" cy="160" rx="22" ry="18" fill="#e8f4ff" opacity="0.55"/>
  <!-- A single eye visible through hair gap (deeply unsettling) -->
  <!-- Dark hollow eye socket hint on left side through hair -->
  <ellipse cx="138" cy="132" rx="8" ry="9" fill="#c8e0f8" opacity="0.4"/>
  <!-- The eye — hollow, dark, crying -->
  <ellipse cx="138" cy="132" rx="5.5" ry="6" fill="#040608" opacity="0.9"/>
  <ellipse cx="138" cy="132" rx="3" ry="3.5" fill="#000000"/>
  <!-- Barely a glint in the hollow eye -->
  <circle cx="140" cy="130" r="1.5" fill="#5588aa" opacity="0.6"/>
  <!-- Second eye barely hinted -->
  <ellipse cx="182" cy="128" rx="6" ry="6.5" fill="#c0d8f0" opacity="0.25"/>
  <ellipse cx="182" cy="128" rx="3.5" ry="4" fill="#020406" opacity="0.6"/>

  <!-- === TEARS — the ghost is crying, visible on pale cheeks === -->
  <!-- Tear streak left cheek -->
  <path d="M136,140 Q133,155 130,172 Q130,178 133,180" fill="none" stroke="url(#tearG)" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M135,145 Q132,158 130,175" fill="none" stroke="#aaccee" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <!-- Tear drop at chin -->
  <ellipse cx="130" cy="180" rx="4" ry="6" fill="#aaccee" opacity="0.55"/>
  <!-- Second tear streak (right side, barely visible through hair) -->
  <path d="M184,136 Q186,152 184,170" fill="none" stroke="url(#tearG)" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>

  <!-- Tear drops falling — floating below chin -->
  <ellipse cx="128" cy="192" rx="3" ry="4" fill="#aaccee" opacity="0.4"/>
  <ellipse cx="135" cy="200" rx="2.5" ry="3.5" fill="#88aadd" opacity="0.3"/>

  <!-- === GHOSTLY BODY OVERLAYS — translucent blue-white shimmer === -->
  <!-- Body shimmer/translucency -->
  <rect x="107" y="187" width="106" height="130" rx="11" fill="url(#ghostBody)" opacity="0.22"/>
  <!-- Edge glow on body sides -->
  <rect x="106" y="188" width="15" height="128" rx="8" fill="#88bbee" opacity="0.15"/>
  <rect x="199" y="188" width="15" height="128" rx="8" fill="#88bbee" opacity="0.15"/>

  <!-- === HOVERING / FLOATING — faint mist beneath feet === -->
  <!-- Wispy ground mist (ghost hovering slightly off ground, at bottom of canvas) -->
  <ellipse cx="160" cy="490" rx="110" ry="28" fill="#4477aa" opacity="0.2" filter="url(#dissolveEdge)"/>
  <ellipse cx="155" cy="498" rx="85" ry="18" fill="#3366aa" opacity="0.12" filter="url(#dissolveEdge)"/>
  <!-- Wispy tendrils upward from ground mist -->
  <path d="M100,485 Q95,475 98,465" fill="none" stroke="#5588bb" stroke-width="4" stroke-linecap="round" opacity="0.2" filter="url(#dissolveEdge)"/>
  <path d="M130,488 Q126,478 128,468" fill="none" stroke="#4477aa" stroke-width="3" stroke-linecap="round" opacity="0.18" filter="url(#dissolveEdge)"/>
  <path d="M190,487 Q194,476 192,466" fill="none" stroke="#5588bb" stroke-width="3" stroke-linecap="round" opacity="0.18" filter="url(#dissolveEdge)"/>
  <path d="M220,485 Q225,474 222,462" fill="none" stroke="#4477aa" stroke-width="4" stroke-linecap="round" opacity="0.2" filter="url(#dissolveEdge)"/>

  <!-- === FINAL GLOW PASS — overall pale blue luminescence === -->
  <ellipse cx="160" cy="280" rx="120" ry="240" fill="#6699cc" opacity="0.06" filter="url(#ghostGlow)"/>
</svg>
