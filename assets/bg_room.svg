<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- 壁のグラデーション -->
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7EFE5"/>
      <stop offset="100%" stop-color="#EDE0CE"/>
    </linearGradient>
    <!-- 床のグラデーション -->
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8956A"/>
      <stop offset="100%" stop-color="#A87850"/>
    </linearGradient>
    <!-- 床の木目パターン -->
    <pattern id="woodGrain" x="0" y="0" width="120" height="1080" patternUnits="userSpaceOnUse">
      <rect width="120" height="1080" fill="none"/>
      <line x1="60" y1="0" x2="60" y2="1080" stroke="#B8855E" stroke-width="1" opacity="0.3"/>
      <!-- 木目のゆらぎ -->
      <path d="M0,200 Q30,195 60,202 Q90,208 120,200" stroke="#A07448" stroke-width="0.8" fill="none" opacity="0.25"/>
      <path d="M0,380 Q40,375 60,383 Q85,390 120,382" stroke="#A07448" stroke-width="0.8" fill="none" opacity="0.25"/>
      <path d="M0,560 Q25,555 60,562 Q95,570 120,560" stroke="#A07448" stroke-width="0.8" fill="none" opacity="0.25"/>
      <path d="M0,740 Q35,736 60,742 Q90,748 120,740" stroke="#A07448" stroke-width="0.8" fill="none" opacity="0.25"/>
      <path d="M0,920 Q28,915 60,922 Q88,928 120,920" stroke="#A07448" stroke-width="0.8" fill="none" opacity="0.25"/>
    </pattern>
    <!-- 壁紙の薄いドットパターン -->
    <pattern id="wallPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#D4B896" opacity="0.35"/>
    </pattern>
    <!-- 巾木グラデーション -->
    <linearGradient id="baseboard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8D0B0"/>
      <stop offset="100%" stop-color="#D4BC98"/>
    </linearGradient>
    <!-- 天井のグラデーション -->
    <linearGradient id="ceilingGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF5EE"/>
      <stop offset="100%" stop-color="#F2E8D8"/>
    </linearGradient>
    <!-- 床との境界シャドウ -->
    <linearGradient id="floorShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B6040" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8B6040" stop-opacity="0"/>
    </linearGradient>
    <!-- 光の差し込み -->
    <linearGradient id="sunlight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF8E8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFF8E8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 天井 -->
  <rect x="0" y="0" width="1920" height="80" fill="url(#ceilingGrad)"/>
  <!-- 天井と壁の境目 -->
  <rect x="0" y="75" width="1920" height="8" fill="#E0CEBC" rx="1"/>

  <!-- 壁 -->
  <rect x="0" y="0" width="1920" height="720" fill="url(#wallGrad)"/>
  <rect x="0" y="0" width="1920" height="720" fill="url(#wallPattern)"/>

  <!-- 左の壁のライン（立体感） -->
  <rect x="0" y="0" width="4" height="720" fill="#D8C8B0" opacity="0.5"/>
  <!-- 右の壁のライン -->
  <rect x="1916" y="0" width="4" height="720" fill="#C8B898" opacity="0.5"/>

  <!-- 壁の中段ボーダー（アクセントライン） -->
  <rect x="0" y="420" width="1920" height="3" fill="#D4BC98" opacity="0.5"/>
  <rect x="0" y="427" width="1920" height="1" fill="#EAD8C0" opacity="0.4"/>

  <!-- 窓からの光（壁に投影） -->
  <polygon points="420,83 680,83 800,420 300,420" fill="url(#sunlight)" opacity="0.5"/>
  <polygon points="980,83 1240,83 1360,420 860,420" fill="url(#sunlight)" opacity="0.3"/>

  <!-- 巾木 -->
  <rect x="0" y="700" width="1920" height="22" fill="url(#baseboard)"/>
  <rect x="0" y="698" width="1920" height="3" fill="#F0E0C8" opacity="0.8"/>
  <rect x="0" y="720" width="1920" height="2" fill="#C0A880" opacity="0.6"/>

  <!-- 床 -->
  <rect x="0" y="720" width="1920" height="360" fill="url(#floorGrad)"/>
  <rect x="0" y="720" width="1920" height="360" fill="url(#woodGrain)"/>

  <!-- 床に落ちる光 -->
  <polygon points="420,720 720,720 900,1080 240,1080" fill="#FFE8B0" opacity="0.12"/>
  <polygon points="980,720 1280,720 1460,1080 800,1080" fill="#FFE8B0" opacity="0.08"/>

  <!-- 床の奥行きシャドウ -->
  <rect x="0" y="720" width="1920" height="30" fill="url(#floorShadow)"/>

  <!-- 床のハイライト（光沢感） -->
  <rect x="0" y="722" width="1920" height="4" fill="#D4A070" opacity="0.3"/>
</svg>
