<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="tvScreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3A5070"/>
      <stop offset="100%" stop-color="#4A6888"/>
    </linearGradient>
    <linearGradient id="tvStand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B08050"/>
      <stop offset="100%" stop-color="#987040"/>
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="400" cy="580" rx="380" ry="22" fill="rgba(80,60,30,0.10)"/>

  <!-- TV Stand / Board -->
  <rect x="60" y="440" width="680" height="120" rx="6" fill="url(#tvStand)"/>
  <!-- Drawers -->
  <rect x="76" y="456" width="210" height="88" rx="4" fill="#A87848" stroke="#987040" stroke-width="1"/>
  <rect x="296" y="456" width="210" height="88" rx="4" fill="#A87848" stroke="#987040" stroke-width="1"/>
  <rect x="516" y="456" width="210" height="88" rx="4" fill="#A87848" stroke="#987040" stroke-width="1"/>
  <!-- Drawer handles -->
  <rect x="160" y="496" width="40" height="4" rx="2" fill="#C8A878"/>
  <rect x="380" y="496" width="40" height="4" rx="2" fill="#C8A878"/>
  <rect x="600" y="496" width="40" height="4" rx="2" fill="#C8A878"/>
  <!-- Stand top highlight -->
  <rect x="64" y="440" width="672" height="8" rx="3" fill="#C49868" opacity="0.4"/>
  <!-- Legs -->
  <rect x="80" y="556" width="14" height="30" rx="3" fill="#806038"/>
  <rect x="706" y="556" width="14" height="30" rx="3" fill="#806038"/>

  <!-- TV -->
  <rect x="140" y="60" width="520" height="360" rx="4" fill="#2A2A32"/>
  <!-- Screen -->
  <rect x="150" y="68" width="500" height="332" rx="2" fill="url(#tvScreen)"/>
  <!-- Screen reflection -->
  <polygon points="150,68 650,68 650,180 150,240" fill="rgba(255,255,255,0.04)"/>
  <!-- Power LED -->
  <circle cx="400" cy="412" r="3" fill="#60C060" opacity="0.6"/>
  <!-- TV base stand -->
  <rect x="340" y="420" width="120" height="20" rx="4" fill="#3A3A42"/>
  <rect x="370" y="436" width="60" height="6" rx="2" fill="#4A4A52"/>
</svg>