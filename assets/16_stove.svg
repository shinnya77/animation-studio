<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 420" width="260" height="420">
  <defs>
    <linearGradient id="cabinetG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8F4EE"/>
      <stop offset="100%" stop-color="#ECE4D8"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="130" cy="408" rx="124" ry="12" fill="rgba(80,60,30,0.08)"/>
  <!-- Oven body -->
  <rect x="10" y="70" width="240" height="340" rx="3" fill="url(#cabinetG)" stroke="#D8CCC0" stroke-width="1.5"/>
  <!-- Oven door -->
  <rect x="24" y="148" width="212" height="190" rx="3" fill="#E8E0D4" stroke="#D0C8B8" stroke-width="1.5"/>
  <!-- Oven window -->
  <rect x="42" y="166" width="176" height="110" rx="2" fill="#2A2A30" opacity="0.6"/>
  <rect x="48" y="172" width="164" height="98" rx="1" fill="#3A3840" opacity="0.4"/>
  <!-- Oven handle -->
  <rect x="56" y="296" width="148" height="7" rx="3.5" fill="#C0B8AC"/>
  <!-- Controls -->
  <circle cx="60" cy="110" r="14" fill="#E0D8CC" stroke="#C8C0B0" stroke-width="1.5"/>
  <circle cx="120" cy="110" r="14" fill="#E0D8CC" stroke="#C8C0B0" stroke-width="1.5"/>
  <circle cx="180" cy="110" r="14" fill="#E0D8CC" stroke="#C8C0B0" stroke-width="1.5"/>
  <line x1="60" y1="100" x2="60" y2="96" stroke="#A09888" stroke-width="2"/>
  <line x1="120" y1="100" x2="120" y2="96" stroke="#A09888" stroke-width="2"/>
  <!-- Stovetop surface -->
  <rect x="4" y="56" width="252" height="20" rx="3" fill="#E8E0D4" stroke="#D0C8BC" stroke-width="1"/>
  <!-- Burner left -->
  <circle cx="76" cy="32" r="32" fill="none" stroke="#4A4A50" stroke-width="3"/>
  <circle cx="76" cy="32" r="18" fill="none" stroke="#4A4A50" stroke-width="2"/>
  <circle cx="76" cy="32" r="4" fill="#4A4A50"/>
  <line x1="48" y1="32" x2="104" y2="32" stroke="#5A5A60" stroke-width="2"/>
  <line x1="76" y1="4" x2="76" y2="60" stroke="#5A5A60" stroke-width="2"/>
  <!-- Burner right -->
  <circle cx="184" cy="32" r="28" fill="none" stroke="#4A4A50" stroke-width="2.5"/>
  <circle cx="184" cy="32" r="16" fill="none" stroke="#4A4A50" stroke-width="1.5"/>
  <circle cx="184" cy="32" r="3.5" fill="#4A4A50"/>
  <line x1="160" y1="32" x2="208" y2="32" stroke="#5A5A60" stroke-width="2"/>
  <line x1="184" y1="8" x2="184" y2="56" stroke="#5A5A60" stroke-width="2"/>
</svg>