  <defs>
    <linearGradient id="shelfBodyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9A6A30"/>
      <stop offset="10%" stop-color="#C48848"/>
      <stop offset="50%" stop-color="#B87838"/>
      <stop offset="90%" stop-color="#C48848"/>
      <stop offset="100%" stop-color="#8A5A28"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
