<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500">
  <defs>
    <!-- Candle light from below — warm amber radial -->
    <radialGradient id="candleLight" cx="50%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#ffaa33" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#dd7700" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#6a2a00" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- Face lit from below — warm underlit skin -->
    <radialGradient id="faceLight1" cx="50%" cy="90%" r="60%">
      <stop offset="0%" stop-color="#e8a050" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#c07030" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- Silhouette shadow body fill -->
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e04"/>
      <stop offset="40%" stop-color="#100805"/>
      <stop offset="100%" stop-color="#060402"/>
    </linearGradient>
    <!-- Hair shadow color -->
    <linearGradient id="hairGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0806"/>
      <stop offset="100%" stop-color="#1a1208"/>
    </linearGradient>
    <!-- Face skin (lit from below) -->
    <radialGradient id="skinGrad" cx="50%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#d4883a"/>
      <stop offset="40%" stop-color="#b06020"/>
      <stop offset="80%" stop-color="#6a3010"/>
      <stop offset="100%" stop-color="#2a1005"/>
    </radialGradient>
    <!-- Glow filter for candle source -->
    <filter id="candleGlowFilt" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="faceGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Skin gradient lit from below -->
    <radialGradient id="skinBot1" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#cc7730"/>
      <stop offset="50%" stop-color="#883310"/>
      <stop offset="100%" stop-color="#1a0804"/>
    </radialGradient>
  </defs>

  <!-- Dark background -->
  <rect width="700" height="500" fill="#060402"/>

  <!-- Candle glow light source at bottom center -->
  <ellipse cx="350" cy="460" rx="320" ry="200" fill="url(#candleLight)" opacity="0.9" filter="url(#candleGlowFilt)"/>
  <ellipse cx="350" cy="465" rx="180" ry="110" fill="#ff9922" opacity="0.12" filter="url(#candleGlowFilt)"/>

  <!-- Ground they're sitting on — slight glow -->
  <ellipse cx="350" cy="475" rx="300" ry="40" fill="#3a1a05" opacity="0.6"/>

  <!-- === KID 1 — Back-left, boy, short hair, curious expression === -->
  <!-- Body silhouette sitting cross-legged -->
  <ellipse cx="115" cy="420" rx="45" ry="28" fill="#100808" opacity="0.9"/> <!-- sitting base -->
  <rect x="85" y="350" width="60" height="80" rx="8" fill="url(#bodyGrad)" opacity="0.92"/> <!-- torso -->
  <!-- Shirt detail (white shirt, underlit amber) -->
  <rect x="90" y="355" width="50" height="65" rx="6" fill="#2a1a08" opacity="0.6"/>
  <!-- Head -->
  <ellipse cx="115" cy="325" rx="28" ry="32" fill="url(#skinBot1)" opacity="0.9"/>
  <!-- Hair (dark, short) -->
  <ellipse cx="115" cy="308" rx="29" ry="18" fill="url(#hairGrad)"/>
  <!-- Eyes (slightly wide, curious) -->
  <ellipse cx="107" cy="320" rx="5" ry="5.5" fill="#0a0604"/>
  <ellipse cx="107" cy="319" rx="3" ry="3.5" fill="#cc7730" opacity="0.6"/>
  <ellipse cx="123" cy="320" rx="5" ry="5.5" fill="#0a0604"/>
  <ellipse cx="123" cy="319" rx="3" ry="3.5" fill="#cc7730" opacity="0.6"/>
  <!-- White eye reflections (candle light) -->
  <circle cx="106" cy="318" r="1.5" fill="#ffcc88" opacity="0.8"/>
  <circle cx="122" cy="318" r="1.5" fill="#ffcc88" opacity="0.8"/>
  <!-- Slight smile mouth -->
  <path d="M109,334 Q115,338 121,334" fill="none" stroke="#7a3a10" stroke-width="2" stroke-linecap="round"/>
  <!-- Ear -->
  <ellipse cx="87" cy="326" rx="5" ry="7" fill="#b05a20" opacity="0.7"/>
  <ellipse cx="143" cy="326" rx="5" ry="7" fill="#b05a20" opacity="0.7"/>
  <!-- Arms -->
  <line x1="88" y1="375" x2="65" y2="400" stroke="#c07028" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
  <line x1="142" y1="375" x2="158" y2="398" stroke="#c07028" stroke-width="8" stroke-linecap="round" opacity="0.8"/>

  <!-- === KID 2 — Front-left girl, slightly leaning forward, excited === -->
  <ellipse cx="230" cy="430" rx="48" ry="25" fill="#120908" opacity="0.9"/>
  <rect x="202" y="360" width="58" height="78" rx="8" fill="url(#bodyGrad)" opacity="0.9"/>
  <!-- Sailor collar/dress detail -->
  <path d="M202,368 L231,385 L260,368" fill="#1a1008" stroke="#2a1808" stroke-width="1" opacity="0.7"/>
  <!-- Head -->
  <ellipse cx="231" cy="335" rx="30" ry="33" fill="url(#skinBot1)" opacity="0.92"/>
  <!-- Hair (girl — longer, twin tails hint) -->
  <ellipse cx="231" cy="314" rx="31" ry="20" fill="url(#hairGrad)"/>
  <path d="M202,318 Q190,340 195,360" fill="#1a1208" stroke="#0a0806" stroke-width="1" opacity="0.8"/>
  <path d="M260,318 Q272,340 267,360" fill="#1a1208" stroke="#0a0806" stroke-width="1" opacity="0.8"/>
  <!-- Face — excited, wide eyes -->
  <ellipse cx="221" cy="332" rx="5.5" ry="6" fill="#0a0604"/>
  <ellipse cx="221" cy="331" rx="3.5" ry="4" fill="#dd8833" opacity="0.65"/>
  <ellipse cx="241" cy="332" rx="5.5" ry="6" fill="#0a0604"/>
  <ellipse cx="241" cy="331" rx="3.5" ry="4" fill="#dd8833" opacity="0.65"/>
  <circle cx="220" cy="330" r="1.8" fill="#ffcc88" opacity="0.85"/>
  <circle cx="240" cy="330" r="1.8" fill="#ffcc88" opacity="0.85"/>
  <!-- Open mouth slightly (talking/gasping) -->
  <path d="M223,346 Q231,352 239,346" fill="#5a1a08" stroke="#7a2a08" stroke-width="1.5" stroke-linecap="round"/>
  <ellipse cx="231" cy="348" rx="6" ry="3" fill="#3a0e06" opacity="0.7"/>
  <!-- Ear -->
  <ellipse cx="201" cy="336" rx="5" ry="7" fill="#aa5018" opacity="0.7"/>
  <ellipse cx="261" cy="336" rx="5" ry="7" fill="#aa5018" opacity="0.7"/>
  <!-- Arms - leaning forward -->
  <line x1="204" y1="385" x2="195" y2="415" stroke="#bb6824" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
  <line x1="258" y1="385" x2="265" y2="412" stroke="#bb6824" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
  <!-- Hand on floor (leaning) -->
  <ellipse cx="195" cy="418" rx="10" ry="7" fill="#b86020" opacity="0.75"/>

  <!-- === KID 3 — Center front, Sawa-like girl, smiling mischievously === -->
  <ellipse cx="350" cy="435" rx="50" ry="26" fill="#140a08" opacity="0.9"/>
  <rect x="320" y="365" width="62" height="80" rx="8" fill="url(#bodyGrad)" opacity="0.88"/>
  <!-- Clothes detail -->
  <rect x="325" y="370" width="52" height="65" rx="6" fill="#1a1005" opacity="0.5"/>
  <!-- Head (slightly larger, center focus) -->
  <ellipse cx="351" cy="337" rx="32" ry="34" fill="url(#skinBot1)" opacity="0.95"/>
  <!-- Stylish hair — slight wave -->
  <ellipse cx="351" cy="315" rx="33" ry="21" fill="url(#hairGrad)"/>
  <path d="M319,322 Q312,305 324,295 Q338,288 351,290 Q364,288 376,295 Q388,305 383,322" fill="#0a0806"/>
  <!-- Face — mischievous smile -->
  <ellipse cx="340" cy="334" rx="5.5" ry="6" fill="#080604"/>
  <ellipse cx="340" cy="333" rx="3.5" ry="4" fill="#ee9944" opacity="0.7"/>
  <ellipse cx="362" cy="334" rx="5.5" ry="6" fill="#080604"/>
  <ellipse cx="362" cy="333" rx="3.5" ry="4" fill="#ee9944" opacity="0.7"/>
  <circle cx="339" cy="332" r="2" fill="#ffdd99" opacity="0.9"/>
  <circle cx="361" cy="332" r="2" fill="#ffdd99" opacity="0.9"/>
  <!-- Mischievous half-smile -->
  <path d="M340,349 Q351,358 362,352" fill="none" stroke="#8a3a12" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Slight raised eyebrow lines -->
  <path d="M334,324 Q340,320 346,323" fill="none" stroke="#0a0806" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M356,322 Q362,318 368,321" fill="none" stroke="#0a0806" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- Ear -->
  <ellipse cx="319" cy="338" rx="5" ry="7" fill="#aa5018" opacity="0.7"/>
  <ellipse cx="383" cy="338" rx="5" ry="7" fill="#aa5018" opacity="0.7"/>
  <!-- Arms -->
  <line x1="322" y1="387" x2="308" y2="420" stroke="#c07025" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
  <line x1="378" y1="387" x2="392" y2="415" stroke="#c07025" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
  <!-- Hands placed on knees -->
  <ellipse cx="308" cy="423" rx="11" ry="7" fill="#b86020" opacity="0.78"/>
  <ellipse cx="392" cy="418" rx="11" ry="7" fill="#b86020" opacity="0.78"/>

  <!-- === KID 4 — Front-right boy, Mitsugu-like, slightly cautious/quiet === -->
  <ellipse cx="470" cy="432" rx="47" ry="26" fill="#120908" opacity="0.9"/>
  <rect x="442" y="363" width="58" height="78" rx="8" fill="url(#bodyGrad)" opacity="0.9"/>
  <!-- School shirt -->
  <rect x="447" y="368" width="48" height="62" rx="5" fill="#1e1208" opacity="0.5"/>
  <!-- Head -->
  <ellipse cx="471" cy="337" rx="29" ry="32" fill="url(#skinBot1)" opacity="0.9"/>
  <!-- Hair - short, neat -->
  <ellipse cx="471" cy="317" rx="30" ry="19" fill="url(#hairGrad)"/>
  <!-- Face — cautious, slightly furrowed brow, serious -->
  <ellipse cx="461" cy="333" rx="5" ry="5.5" fill="#090604"/>
  <ellipse cx="461" cy="332" rx="3" ry="3.5" fill="#cc7728" opacity="0.6"/>
  <ellipse cx="481" cy="333" rx="5" ry="5.5" fill="#090604"/>
  <ellipse cx="481" cy="332" rx="3" ry="3.5" fill="#cc7728" opacity="0.6"/>
  <circle cx="460" cy="331" r="1.5" fill="#ffbb77" opacity="0.8"/>
  <circle cx="480" cy="331" r="1.5" fill="#ffbb77" opacity="0.8"/>
  <!-- Slightly frowning/serious mouth -->
  <path d="M463,346 Q471,349 479,346" fill="none" stroke="#7a3010" stroke-width="2" stroke-linecap="round"/>
  <!-- Concerned brow lines -->
  <path d="M456,323 Q462,319 468,322" fill="none" stroke="#0a0806" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
  <path d="M474,322 Q480,318 486,321" fill="none" stroke="#0a0806" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
  <!-- Ear -->
  <ellipse cx="442" cy="338" rx="5" ry="7" fill="#aa4e18" opacity="0.7"/>
  <ellipse cx="500" cy="338" rx="5" ry="7" fill="#aa4e18" opacity="0.7"/>
  <!-- Arms -->
  <line x1="444" y1="385" x2="430" y2="415" stroke="#bb6820" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
  <line x1="498" y1="385" x2="510" y2="412" stroke="#bb6820" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
  <ellipse cx="430" cy="418" rx="10" ry="7" fill="#b06020" opacity="0.75"/>

  <!-- === KID 5 — Back-right, girl, leaning in whispering === -->
  <ellipse cx="590" cy="422" rx="44" ry="26" fill="#0e0806" opacity="0.9"/>
  <rect x="562" y="352" width="57" height="78" rx="8" fill="url(#bodyGrad)" opacity="0.88"/>
  <!-- Head, leaning slightly forward/left -->
  <ellipse cx="587" cy="326" rx="27" ry="30" fill="url(#skinBot1)" opacity="0.88"/>
  <!-- Long hair (longer girl) -->
  <ellipse cx="587" cy="307" rx="28" ry="18" fill="url(#hairGrad)"/>
  <path d="M560,315 Q552,340 555,370" fill="#0f0c08" opacity="0.85"/>
  <path d="M614,315 Q622,340 618,370" fill="#0f0c08" opacity="0.85"/>
  <!-- Face — curious, mouth slightly open -->
  <ellipse cx="578" cy="323" rx="5" ry="5.5" fill="#090604"/>
  <ellipse cx="578" cy="322" rx="3" ry="3.5" fill="#cc7728" opacity="0.6"/>
  <ellipse cx="596" cy="323" rx="5" ry="5.5" fill="#090604"/>
  <ellipse cx="596" cy="322" rx="3" ry="3.5" fill="#cc7728" opacity="0.6"/>
  <circle cx="577" cy="321" r="1.5" fill="#ffcc88" opacity="0.8"/>
  <circle cx="595" cy="321" r="1.5" fill="#ffcc88" opacity="0.8"/>
  <!-- Slightly open mouth -->
  <path d="M579,337 Q587,342 595,337" fill="none" stroke="#7a3010" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="587" cy="338" rx="5" ry="2.5" fill="#3a0e06" opacity="0.6"/>
  <!-- Ear -->
  <ellipse cx="560" cy="327" rx="5" ry="7" fill="#aa4e18" opacity="0.7"/>
  <ellipse cx="614" cy="327" rx="5" ry="7" fill="#aa4e18" opacity="0.7"/>
  <!-- Arms -->
  <line x1="564" y1="375" x2="548" y2="405" stroke="#bb6820" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
  <line x1="618" y1="375" x2="630" y2="400" stroke="#bb6820" stroke-width="8" stroke-linecap="round" opacity="0.8"/>

  <!-- === KID 6 — Far back center, partial silhouette, darker === -->
  <!-- Only upper body visible, deeper shadow -->
  <ellipse cx="350" cy="295" rx="26" ry="28" fill="#0c0804" opacity="0.85"/>
  <rect x="326" y="295" width="48" height="60" rx="7" fill="#0a0604" opacity="0.8"/>
  <!-- Hair -->
  <ellipse cx="350" cy="278" rx="27" ry="16" fill="#080604" opacity="0.9"/>
  <!-- Just hint of eyes -->
  <ellipse cx="342" cy="291" rx="4" ry="4.5" fill="#060402"/>
  <ellipse cx="358" cy="291" rx="4" ry="4.5" fill="#060402"/>
  <circle cx="341" cy="290" r="1.2" fill="#dd9933" opacity="0.5"/>
  <circle cx="357" cy="290" r="1.2" fill="#dd9933" opacity="0.5"/>

  <!-- Additional warm ambient light pools on floor between kids -->
  <ellipse cx="280" cy="455" rx="60" ry="20" fill="#5a2005" opacity="0.3"/>
  <ellipse cx="420" cy="458" rx="55" ry="18" fill="#5a2005" opacity="0.25"/>

  <!-- Candle flame (implied, at bottom center — just the glow tip visible) -->
  <ellipse cx="350" cy="468" rx="12" ry="18" fill="#ffaa22" opacity="0.75" filter="url(#candleGlowFilt)"/>
  <ellipse cx="350" cy="470" rx="6" ry="10" fill="#ffffff" opacity="0.5"/>
  <ellipse cx="350" cy="475" rx="18" ry="8" fill="#cc6600" opacity="0.5"/>

  <!-- Overall darkness vignette edges -->
  <rect x="0" y="0" width="700" height="500" fill="url(#candleLight)" opacity="0"/>
  <!-- Dark corners -->
  <rect x="0" y="0" width="150" height="500" fill="#000000" opacity="0.45"/>
  <rect x="550" y="0" width="150" height="500" fill="#000000" opacity="0.45"/>
  <rect x="0" y="0" width="700" height="180" fill="#000000" opacity="0.6"/>
</svg>
