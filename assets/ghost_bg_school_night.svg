<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060918"/>
      <stop offset="40%" stop-color="#0d1433"/>
      <stop offset="100%" stop-color="#1a1f3a"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1020"/>
      <stop offset="100%" stop-color="#060810"/>
    </linearGradient>
    <radialGradient id="candleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9933" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#cc6600" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#331100" stop-opacity="0"/>
    </radialGradient>
    <filter id="outerGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="fogGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2040" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d1230" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

