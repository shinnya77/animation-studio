  <rect x="1556" y="120" width="8" height="360" fill="#D8C8B0"/>

  <!-- Curtain (short, bedroom style) -->
  <path d="M1384 110 C1390 200,1382 340,1375 490 L1414 490 C1418 340,1414 200,1410 110 Z" fill="#F8F0E8" opacity="0.9"/>
  <path d="M1726 110 C1720 200,1730 340,1735 490 L1710 490 C1706 340,1714 200,1718 110 Z" fill="#F8F0E8" opacity="0.9"/>
  <rect x="1374" y="104" width="368" height="10" rx="5" fill="#D0C0A8"/>

