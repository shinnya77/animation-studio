<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bwG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8F0E8"/>
      <stop offset="100%" stop-color="#F0E8DC"/>
    </linearGradient>
    <linearGradient id="bfG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4A574"/>
      <stop offset="100%" stop-color="#C08860"/>
    </linearGradient>
    <linearGradient id="bskyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#90C8F0"/>
      <stop offset="100%" stop-color="#C8E4FF"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="0.75" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="rgba(255,240,200,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,240,200,0)"/>
    </radialGradient>
  </defs>

