<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="600" height="700">
  <defs>
    <!-- 窓外の空グラデーション -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8D8F0"/>
      <stop offset="60%" stop-color="#C8EAF8"/>
      <stop offset="100%" stop-color="#E8F6FF"/>
    </linearGradient>
    <!-- 外の光 -->
    <radialGradient id="sunGlow" cx="0.7" cy="0.15" r="0.5">
      <stop offset="0%" stop-color="#FFF5C8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C8EAF8" stop-opacity="0"/>
    </radialGradient>
    <!-- 窓ガラスのハイライト -->
    <linearGradient id="glassShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- カーテンの縦グラデーション（左） -->
    <linearGradient id="curtainL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5C8D8"/>
      <stop offset="40%" stop-color="#F0B8CC"/>
      <stop offset="70%" stop-color="#E8A8C0"/>
      <stop offset="100%" stop-color="#D898B0"/>
    </linearGradient>
    <!-- カーテンの縦グラデーション（右） -->
    <linearGradient id="curtainR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D898B0"/>
      <stop offset="30%" stop-color="#E8A8C0"/>
      <stop offset="60%" stop-color="#F0B8CC"/>
      <stop offset="100%" stop-color="#F5C8D8"/>
    </linearGradient>
    <!-- 窓枠グラデーション -->
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8F0E8"/>
      <stop offset="100%" stop-color="#E0D0C0"/>
    </linearGradient>
    <!-- 外の雲 -->
    <filter id="cloudBlur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <!-- カーテンのヒダ影 -->
    <linearGradient id="curtainFold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C888A8" stop-opacity="0.3"/>
      <stop offset="20%" stop-color="#C888A8" stop-opacity="0"/>
      <stop offset="80%" stop-color="#C888A8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#C888A8" stop-opacity="0.2"/>
    </linearGradient>
    <!-- カーテンタッセル -->
    <linearGradient id="tasselGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8A8C0"/>
      <stop offset="100%" stop-color="#C888A0"/>
    </linearGradient>
  </defs>

  <!-- 窓枠（外側）-->
  <rect x="30" y="30" width="540" height="620" rx="6" fill="#E8D8C8"/>
  <rect x="30" y="30" width="540" height="620" rx="6" fill="none" stroke="#D0C0B0" stroke-width="2"/>

  <!-- 窓枠（内側フレーム） -->
  <rect x="50" y="50" width="500" height="580" rx="4" fill="url(#frameGrad)"/>

  <!-- 窓ガラス（空の外側） -->
  <rect x="60" y="60" width="480" height="560" fill="url(#skyGrad)"/>

  <!-- 空の光グロー -->
  <rect x="60" y="60" width="480" height="560" fill="url(#sunGlow)"/>

  <!-- 外の雲（遠景）-->
  <ellipse cx="200" cy="130" rx="70" ry="22" fill="white" opacity="0.85" filter="url(#cloudBlur)"/>
  <ellipse cx="170" cy="135" rx="45" ry="18" fill="white" opacity="0.9" filter="url(#cloudBlur)"/>
  <ellipse cx="230" cy="138" rx="40" ry="16" fill="white" opacity="0.85" filter="url(#cloudBlur)"/>

  <ellipse cx="400" cy="160" rx="55" ry="18" fill="white" opacity="0.8" filter="url(#cloudBlur)"/>
  <ellipse cx="375" cy="165" rx="38" ry="15" fill="white" opacity="0.85" filter="url(#cloudBlur)"/>
  <ellipse cx="430" cy="168" rx="35" ry="14" fill="white" opacity="0.8" filter="url(#cloudBlur)"/>

  <!-- 遠くの建物シルエット -->
  <rect x="80" y="480" width="60" height="140" fill="#B8D0E0" opacity="0.6"/>
  <rect x="145" y="510" width="45" height="110" fill="#C0D8E8" opacity="0.5"/>
  <rect x="330" y="490" width="70" height="130" fill="#B8D0E0" opacity="0.55"/>
  <rect x="400" y="500" width="50" height="120" fill="#C0D8E8" opacity="0.5"/>
  <rect x="455" y="470" width="65" height="150" fill="#B0C8D8" opacity="0.6"/>
  <!-- 建物の窓 -->
  <rect x="92" y="495" width="10" height="12" fill="#D8E8F0" opacity="0.8"/>
  <rect x="112" y="495" width="10" height="12" fill="#D8E8F0" opacity="0.8"/>
  <rect x="92" y="520" width="10" height="12" fill="#D8E8F0" opacity="0.8"/>
  <rect x="112" y="520" width="10" height="12" fill="#FFE8A0" opacity="0.7"/>
  <rect x="342" y="505" width="12" height="14" fill="#D8E8F0" opacity="0.8"/>
  <rect x="362" y="505" width="12" height="14" fill="#FFE8A0" opacity="0.7"/>

  <!-- 窓の桟（中央横） -->
  <rect x="60" y="338" width="480" height="10" fill="url(#frameGrad)" rx="2"/>
  <rect x="60" y="340" width="480" height="2" fill="#F8F0E8" opacity="0.6"/>

  <!-- 窓の桟（中央縦） -->
  <rect x="295" y="60" width="10" height="570" fill="url(#frameGrad)" rx="2"/>
  <rect x="297" y="60" width="2" height="570" fill="#F8F0E8" opacity="0.6"/>

  <!-- ガラスの反射ハイライト -->
  <rect x="60" y="60" width="480" height="560" fill="url(#glassShine)"/>
  <!-- 縦のキラリ -->
  <rect x="80" y="70" width="8" height="540" fill="white" opacity="0.08"/>
  <rect x="100" y="70" width="3" height="540" fill="white" opacity="0.06"/>

  <!-- ==== 左カーテン ==== -->
  <!-- カーテン本体 -->
  <path d="
    M50,40
    C80,40 110,50 130,65
    C140,200 145,350 138,640
    C120,650 90,655 50,650
    Z
  " fill="url(#curtainL)"/>
  <!-- ヒダ1 -->
  <path d="
    M85,45 C88,150 86,300 83,640
  " stroke="#D898B0" stroke-width="1.5" fill="none" opacity="0.5"/>
  <!-- ヒダ2 -->
  <path d="
    M105,50 C110,160 108,320 105,640
  " stroke="#D898B0" stroke-width="1.5" fill="none" opacity="0.5"/>
  <!-- ヒダの影 -->
  <path d="
    M50,40 C80,40 110,50 130,65 C140,200 145,350 138,640 C120,650 90,655 50,650 Z
  " fill="url(#curtainFold)" opacity="0.5"/>
  <!-- カーテン上部のひだ（ギャザー） -->
  <path d="M50,30 Q65,38 80,32 Q95,26 110,34 Q125,42 140,36" stroke="#E8A8C0" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- ==== 右カーテン ==== -->
  <path d="
    M550,40
    C520,40 490,50 470,65
    C460,200 455,350 462,640
    C480,650 510,655 550,650
    Z
  " fill="url(#curtainR)"/>
  <!-- ヒダ1 -->
  <path d="
    M515,45 C512,150 514,300 517,640
  " stroke="#D898B0" stroke-width="1.5" fill="none" opacity="0.5"/>
  <!-- ヒダ2 -->
  <path d="
    M495,50 C490,160 492,320 495,640
  " stroke="#D898B0" stroke-width="1.5" fill="none" opacity="0.5"/>
  <!-- ヒダの影 -->
  <path d="
    M550,40 C520,40 490,50 470,65 C460,200 455,350 462,640 C480,650 510,655 550,650 Z
  " fill="url(#curtainFold)" opacity="0.5"/>
  <!-- カーテン上部のひだ -->
  <path d="M550,30 Q535,38 520,32 Q505,26 490,34 Q475,42 460,36" stroke="#E8A8C0" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- カーテンレール -->
  <rect x="25" y="22" width="550" height="16" rx="8" fill="#E0C8B8"/>
  <rect x="25" y="22" width="550" height="8" rx="4" fill="#EED8C8" opacity="0.8"/>
  <!-- レールのリング -->
  <circle cx="80" cy="30" r="5" fill="none" stroke="#C8B0A0" stroke-width="2"/>
  <circle cx="130" cy="30" r="5" fill="none" stroke="#C8B0A0" stroke-width="2"/>
  <circle cx="300" cy="30" r="5" fill="none" stroke="#C8B0A0" stroke-width="2"/>
  <circle cx="470" cy="30" r="5" fill="none" stroke="#C8B0A0" stroke-width="2"/>
  <circle cx="520" cy="30" r="5" fill="none" stroke="#C8B0A0" stroke-width="2"/>

  <!-- タッセル（左） -->
  <path d="M138,380 C145,380 150,385 148,395 L142,440 C140,445 136,448 133,445 L127,440 L121,395 C119,385 124,380 131,380 Z"
    fill="url(#tasselGrad)"/>
  <line x1="134" y1="440" x2="128" y2="465" stroke="#C888A0" stroke-width="1.5"/>
  <line x1="134" y1="440" x2="134" y2="470" stroke="#C888A0" stroke-width="1.5"/>
  <line x1="134" y1="440" x2="140" y2="465" stroke="#C888A0" stroke-width="1.5"/>
  <circle cx="128" cy="467" r="3" fill="#B878A0"/>
  <circle cx="134" cy="472" r="3" fill="#B878A0"/>
  <circle cx="140" cy="467" r="3" fill="#B878A0"/>

  <!-- タッセル（右） -->
  <path d="M462,380 C469,380 474,385 472,395 L466,440 C464,445 460,448 457,445 L451,440 L445,395 C443,385 448,380 455,380 Z"
    fill="url(#tasselGrad)"/>
  <line x1="458" y1="440" x2="452" y2="465" stroke="#C888A0" stroke-width="1.5"/>
  <line x1="458" y1="440" x2="458" y2="470" stroke="#C888A0" stroke-width="1.5"/>
  <line x1="458" y1="440" x2="464" y2="465" stroke="#C888A0" stroke-width="1.5"/>
  <circle cx="452" cy="467" r="3" fill="#B878A0"/>
  <circle cx="458" cy="472" r="3" fill="#B878A0"/>
  <circle cx="464" cy="467" r="3" fill="#B878A0"/>

  <!-- 窓枠の影（内側）-->
  <rect x="60" y="60" width="480" height="560" fill="none" stroke="#C8B0A0" stroke-width="3" opacity="0.4"/>
</svg>
