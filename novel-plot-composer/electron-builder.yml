appId: com.shinnya77.novelplotcomposer
productName: Novel Plot Composer
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - '!**/*.map'
fileAssociations:
  - ext: novelplot
    name: Novel Plot Project
    role: Editor
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.productivity
linux:
  target: [AppImage]
  category: Office
